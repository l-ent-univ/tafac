<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FCFBF8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />
    <meta name="application-name" content="%LENT_APP_NAME%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%LENT_APP_NAME%" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <meta name="googlebot" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <title>%LENT_SEO_TITLE%</title>

    <!-- Primary Meta Tags. __PUBLIC_ORIGIN__ is the site's address, set by
         the server as it sends the page (server.js), so link previews (which
         don't run the app) get absolute URLs; the canonical is the home
         page, or a university's own page (/<slug>, fillPagePath). -->
    <meta
      name="description"
      content="%LENT_SEO_DESCRIPTION%"
    />
    <link rel="canonical" href="__PUBLIC_ORIGIN__/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="%LENT_APP_NAME%" />
    <meta property="og:url" content="__PUBLIC_ORIGIN__/" />
    <meta property="og:title" content="%LENT_SEO_TITLE%" />
    <meta
      property="og:description"
      content="%LENT_SEO_DESCRIPTION%"
    />
    <meta property="og:image" content="__PUBLIC_ORIGIN__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aperçu de l'application %LENT_APP_NAME%" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="__PUBLIC_ORIGIN__/" />
    <meta name="twitter:title" content="%LENT_SEO_TITLE%" />
    <meta
      name="twitter:description"
      content="%LENT_SEO_DESCRIPTION%"
    />
    <meta name="twitter:image" content="__PUBLIC_ORIGIN__/og-image.jpg" />
    <meta name="twitter:image:alt" content="Aperçu de l'application %LENT_APP_NAME%" />

    <script type="application/ld+json" id="seo-structured-data">
      [
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "%LENT_APP_NAME%",
          "alternateName": %LENT_ALTERNATE_NAMES_JSON%,
          "url": "__PUBLIC_ORIGIN__/",
          "inLanguage": "fr-FR"
        },
        {
          "@context": "https://schema.org",
          "@type": "WebApplication",
          "name": "%LENT_APP_NAME%",
          "url": "__PUBLIC_ORIGIN__/",
          "image": "__PUBLIC_ORIGIN__/og-image.jpg",
          "description": "%LENT_SEO_DESCRIPTION%",
          "applicationCategory": "EducationalApplication",
          "operatingSystem": "Web, iOS, Android",
          "inLanguage": "fr-FR",
          "isAccessibleForFree": true,
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
          "sameAs": ["%LENT_REPO_URL%"]
        }
      ]
    </script>

    <script>
      // Theme before first paint, so a forced Clair/Sombre never flashes the
      // system one. Mirrors src/theme.js (same key, same resolution).
      (function () {
        var theme = 'auto'
        try {
          var stored = JSON.parse(localStorage.getItem('l-ent:theme') || 'null')
          if (stored && (stored.value === 'light' || stored.value === 'dark')) theme = stored.value
        } catch (error) {}
        var dark = theme === 'dark'
          || (theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>

    <style>
      :root {
        color-scheme: light;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f3ed;
        color: #341200;
      }

      [data-theme="dark"] body {
        background: #0f0f0f;
        color: #f3ede8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="margin:0;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
        JavaScript est nécessaire pour utiliser l&apos;application.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
