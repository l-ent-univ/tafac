[package]
name = "tafac-desktop"
version = "0.1.0"
description = "Tafac, l'appli de bureau"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net", "time", "io-util"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
http = "1"
cookie = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
