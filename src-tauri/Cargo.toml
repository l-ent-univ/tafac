[package]
name = "tafac-desktop"
version = "0.0.0"
description = "Tafac, l'appli de bureau"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: a second web view in the window (src/moodle.rs, Window::add_child).
tauri = { version = "2", features = ["macos-private-api", "unstable", "webview-data-url"] }
tokio = { version = "1", features = ["net", "time", "io-util", "sync"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
http = "1"
cookie = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
# Updates (src/updater.rs): the check, the download and its signature, the
# install. Driven from Rust: the page has no updater command to call.
tauri-plugin-updater = "2"
semver = "1"

# Saved passwords (macOS): AuthenticationServices' password sheet and the
# Security framework's shared web credentials (src/passwords.rs).
[target.'cfg(target_os = "macos")'.dependencies]
# Whether the app's bundle can be replaced without a password (src/updater.rs).
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-authentication-services = "0.3"
# Moodle's view (src/moodle_native.rs): its navigation delegate. The crate
# Tauri's web view already builds, with what it reads of it.
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "block2",
    "WKWebView",
    "WKFrameInfo",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKNavigationResponse",
] }

# The session secret in the system's credential store (src/secret.rs):
# each system's own backend, nothing else of the crate. On Linux the Secret
# Service over libdbus, which the window toolkit already links.
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
default-features = false
features = ["apple-native"]

[target.'cfg(windows)'.dependencies.keyring]
version = "3"
default-features = false
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
default-features = false
features = ["sync-secret-service"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
