[package]
name = "tafac-desktop"
version = "0.1.0"
description = "Tafac, l'appli de bureau"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tokio = { version = "1", features = ["net", "time", "io-util", "sync"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
http = "1"
cookie = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

# Saved passwords (macOS): AuthenticationServices' password sheet and the
# Security framework's shared web credentials (src/passwords.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-authentication-services = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
