[package]
name = "tauri-plugin-share"
version = "0.0.0"
description = "Tafac's iOS app: the system's share sheet for a file the app downloaded"
license = "AGPL-3.0-only"
edition = "2021"
publish = false
links = "tauri-plugin-share"

[dependencies]
tauri = { version = "2" }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
