[package]
name = "tafac-gateway"
version = "0.0.0"
description = "Tafac's backend in Rust: it signs in, holds the session and answers the page's API through tonAPI, on tafac.fr and in the apps"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

# One code for the three places Tafac runs: the apps call the library from
# their bridge (src-tauri/src/bridge.rs), with the `app` feature; tafac.fr
# runs the binary. No Tauri here.
[features]
default = ["server"]
# The HTTP server, alone or in front of Node, and the binary that runs it.
server = [
    "app",
    "dep:hyper",
    "dep:hyper-util",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/signal",
]
# What the apps' bridge needs beyond the routes, and tafac.fr's server too:
# the page and its built files, read as they go out (own/statics.rs,
# own/page.rs, own/site.rs), and the apps' remote settings, read and checked
# (own/settings/).
app = [
    "dep:http-body",
    "dep:http-body-util",
    "dep:minisign-verify",
    "tokio/io-util",
    "tokio/fs",
]
# A made-up campus for the tests of what uses this crate (the apps' bridge).
testing = ["tokio/rt-multi-thread", "tokio/net", "tokio/io-util"]

[[bin]]
name = "tafac-gateway"
required-features = ["server"]

[dependencies]
# tonAPI's own code, at one commit of its repository, never a copy of it: it
# signs in at the university, its providers ask the services, its settings
# say where (build.rs puts them in the crate), its session holds the cookies.
tonapi-providers = { git = "https://github.com/l-ent-univ/tonAPI", rev = "1ac9fdd7b9dfe4a61a41aa6ac1f75501419922e2" }
tonapi-config = { git = "https://github.com/l-ent-univ/tonAPI", rev = "1ac9fdd7b9dfe4a61a41aa6ac1f75501419922e2" }
tonapi-session = { git = "https://github.com/l-ent-univ/tonAPI", rev = "1ac9fdd7b9dfe4a61a41aa6ac1f75501419922e2" }
tonapi-core = { git = "https://github.com/l-ent-univ/tonAPI", rev = "1ac9fdd7b9dfe4a61a41aa6ac1f75501419922e2" }
# tonAPI's own browser (a jar of cookies, one request at a time, the CAS's
# pages read): the launch relay walks a service's sign-in with it.
tonapi-http = { git = "https://github.com/l-ent-univ/tonAPI", rev = "1ac9fdd7b9dfe4a61a41aa6ac1f75501419922e2" }
# The time a provider is asked at (tonAPI's Context).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The university's own time: ScoDoc dates an evaluation at its midnight.
chrono-tz = { version = "0.10", default-features = false }
# tonAPI's settings files, read as tonAPI reads them.
toml = "1"
# Where a service of the university is (its address in tonAPI's settings).
url = "2"
# The session's cookie, in the format Node reads (src/session/cookie.rs):
# HKDF-SHA256 for its key, AES-256-GCM (and the system's random bytes for a
# session's id and nonce), base64url.
aes-gcm = "0.11.1"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.23"
http = "1"
serde = { version = "1", features = ["derive"] }
# raw_value: a landing's structured data goes into the page as the build
# wrote it, its keys in their order (own/shell.rs).
serde_json = { version = "1", features = ["raw_value"] }
# rt: what is asked of the university behind an answer (gateway/behind.rs).
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
# A panic inside a provider is one route's error, not a request lost.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The mail's streamed bodies: what tonAPI's webmail is sent (an upload).
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
hyper = { version = "1", features = ["client", "server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"], optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
# The mail's bodies as they stream (an upload, a part), in the apps too.
bytes = "1"
# The apps' remote settings' signature (own/settings/minisign.rs): Ed25519
# over BLAKE2b, as `tauri signer` signs, verification only, no dependency of
# its own. The desktop app has the same one, through Tauri's updater.
minisign-verify = { version = "0.3", optional = true }

# Where tonAPI's settings files are on this computer (build.rs).
[build-dependencies]
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
