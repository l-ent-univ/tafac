[package]
name = "tafac-gateway"
version = "0.0.0"
description = "Tafac's backend in Rust: it signs in, holds the session and answers what moved to tonAPI, in front of the Node server, on tafac.fr and in the apps"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

# One code for the three places Tafac runs: the apps call the library from
# their bridge (src-tauri/src/bridge.rs); tafac.fr runs the binary in front
# of Node. No Tauri here.
[features]
default = ["server"]
# The HTTP server in front of Node, and the binary that runs it.
server = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:bytes",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/io-util",
    "tokio/signal",
]
# A made-up campus for the tests of what uses this crate (the apps' bridge).
testing = ["tokio/rt-multi-thread", "tokio/net", "tokio/io-util"]

[[bin]]
name = "tafac-gateway"
required-features = ["server"]

[dependencies]
# tonAPI's own code, at one commit of its repository, never a copy of it: it
# signs in at the university, its providers ask the services, its settings
# say where (build.rs puts them in the crate), its session holds the cookies.
tonapi-providers = { git = "https://github.com/l-ent-univ/tonAPI", rev = "29b378900afa03e98e253a5d2f81dc62ce085412" }
tonapi-config = { git = "https://github.com/l-ent-univ/tonAPI", rev = "29b378900afa03e98e253a5d2f81dc62ce085412" }
tonapi-session = { git = "https://github.com/l-ent-univ/tonAPI", rev = "29b378900afa03e98e253a5d2f81dc62ce085412" }
tonapi-core = { git = "https://github.com/l-ent-univ/tonAPI", rev = "29b378900afa03e98e253a5d2f81dc62ce085412" }
# The time a provider is asked at (tonAPI's Context).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The university's own time: ScoDoc dates an evaluation at its midnight.
chrono-tz = { version = "0.10", default-features = false }
# tonAPI's settings files, read as tonAPI reads them.
toml = "1"
# Where a service of the university is (its address in tonAPI's settings).
url = "2"
# The session's cookie, in the format Node reads (src/session/cookie.rs):
# HKDF-SHA256 for its key, AES-256-GCM (and the system's random bytes for a
# session's id and nonce), base64url.
aes-gcm = "0.11.1"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.23"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
# A panic inside a provider is one request left to Node, not a request lost.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["client", "server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }

# Where tonAPI's settings files are on this computer (build.rs).
[build-dependencies]
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
