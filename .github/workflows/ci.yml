# CI on every pull request and push to main; on main it also publishes a
# GitHub release and a Docker image (ghcr.io/l-ent-univ/l-ent).
#
# Version bump from the commits since the last v* tag (conventional commits):
#   "type!:" or "BREAKING CHANGE" → major (minor while still 0.x)
#   "feat"                        → minor
#   anything else                 → patch
# Add [skip release] to the head commit message to skip publishing.
#
# Each release also proves where its files come from (docs/VERIFYING.md):
# signed build provenance (Sigstore, actions/attest-build-provenance) for the
# Docker image and for every file of the frontend, the one the image serves
# (taken out of the image, the same on amd64 and arm64), plus their list
# (dist-manifest.sha256) and the page template (index.template.html) on the
# release, for scripts/verify-deployment.mjs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned to the pre-rename name so existing self-hosted installs keep
  # pulling updates after the repo was renamed. Don't derive it from the repo.
  IMAGE: ghcr.io/l-ent-univ/l-ent

jobs:
  check:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-build:
    name: Docker build (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Compute next version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next="0.1.0"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            log=$(git log "$last"..HEAD --format='%s%n%b')
            if printf '%s\n' "$log" | grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE'; then
              if [ "$major" -eq 0 ]; then minor=$((minor + 1)); patch=0; else major=$((major + 1)); minor=0; patch=0; fi
            elif printf '%s\n' "$log" | grep -qE '^feat(\([^)]*\))?:'; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next="$major.$minor.$patch"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: v$next (previous: ${last:-none})"
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            --notes "Image Docker : \`docker pull $IMAGE:$VERSION\` (voir docs/SELF_HOSTING.md)."

  docker-publish:
    name: Docker image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # contents: write to add the manifest to the release; id-token and
      # attestations to sign the provenance.
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest
            type=sha
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # The frontend as the image serves it, from both platforms: they must
      # match byte for byte (the build is reproducible), or nothing is
      # attested. .prerender/ isn't served (dotfiles), robots.txt is
      # generated by the server.
      - name: Take the frontend out of the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for platform in amd64 arm64; do
            id=$(docker create --platform "linux/$platform" "$IMAGE@$DIGEST")
            docker cp "$id:/app/dist" "dist-$platform"
            docker rm "$id" > /dev/null
            # One multi-platform digest can't be pulled for a second
            # platform while the first is stored ("cannot overwrite
            # digest"): dropped before the next.
            docker image rm "$IMAGE@$DIGEST" > /dev/null
          done
          # The two platforms' frontends are the same files, the pre-rendered
          # pages aside: server.js reads .prerender into the pages it sends,
          # never serves it as a file (left out of the manifest too).
          diff -r -x .prerender dist-amd64 dist-arm64
          (cd dist-amd64 && find . -type f ! -path './.prerender/*' ! -name robots.txt | sed 's|^\./||' | LC_ALL=C sort | xargs -d '\n' sha256sum) > dist-manifest.sha256
          cp dist-amd64/index.html index.template.html
          wc -l < dist-manifest.sha256
      - name: Attest the frontend files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist-manifest.sha256
      - name: Add the manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "v$VERSION" dist-manifest.sha256 index.template.html --clobber
